name: "E2E Tests"

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Architecture to test (or 'all')"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - android-x86_64
          - android-arm64-v8a
          - ios-arm64-simulator
          - ios-x86_64-simulator
      skip_build:
        description: "Skip test app build (use cached)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      architecture:
        description: "Architecture to test (or 'all')"
        required: false
        default: "all"
        type: string
      skip_build:
        description: "Skip test app build"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "lib/**"
      - "test/e2e/**"
      - ".github/workflows/e2e-test.yml"

permissions:
  contents: read
  checks: write

jobs:
  prepare:
    name: "Prepare"
    runs-on: ubuntu-latest
    outputs:
      otp-version: ${{ steps.versions.outputs.otp-version }}
      elixir-version: ${{ steps.versions.outputs.elixir-version }}
      release-tag: ${{ steps.versions.outputs.release-tag }}
      run-android: ${{ steps.matrix.outputs.run-android }}
      run-ios: ${{ steps.matrix.outputs.run-ios }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read versions from .tool-versions
        id: versions
        run: |
          OTP_VERSION=$(grep '^erlang' .tool-versions | awk '{print $2}')
          ELIXIR_VERSION=$(grep '^elixir' .tool-versions | awk '{print $2}' | sed 's/-otp-[0-9]*//')
          RELEASE_TAG="OTP-${OTP_VERSION}"
          echo "otp-version=${OTP_VERSION}" >> $GITHUB_OUTPUT
          echo "elixir-version=${ELIXIR_VERSION}" >> $GITHUB_OUTPUT
          echo "release-tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Determine test matrix
        id: matrix
        run: |
          ARCH="${{ github.event.inputs.architecture || 'all' }}"
          if [[ "$ARCH" == "all" || "$ARCH" == android-* ]]; then
            echo "run-android=true" >> $GITHUB_OUTPUT
          else
            echo "run-android=false" >> $GITHUB_OUTPUT
          fi
          if [[ "$ARCH" == "all" || "$ARCH" == ios-* ]]; then
            echo "run-ios=true" >> $GITHUB_OUTPUT
          else
            echo "run-ios=false" >> $GITHUB_OUTPUT
          fi

  e2e-android:
    name: "E2E Android"
    runs-on: ubuntu-latest
    needs: [prepare]
    if: needs.prepare.outputs.run-android == 'true'
    timeout-minutes: 30
    steps:
      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ needs.prepare.outputs.otp-version }}
          elixir-version: ${{ needs.prepare.outputs.elixir-version }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Android runtime from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _build
          cd _build
          gh release download "${{ needs.prepare.outputs.release-tag }}" \
            --pattern "android-otp-*.tar.gz" \
            --repo ${{ github.repository }}
          tar -xzf android-otp-*.tar.gz
          echo "Downloaded Android runtime:"
          ls -la

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('test/e2e/apps/android/**/*.gradle*') }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build test app
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          mix deps.get
          mix e2e.build --arch android-x86_64

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mix e2e.run --arch android-x86_64 --output-format junit --output _build/e2e/android-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-results
          path: _build/e2e/android-results.xml

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '_build/e2e/android-results.xml'
          check_name: 'Android E2E Test Results'
          fail_on_failure: true

  e2e-ios:
    name: "E2E iOS"
    runs-on: macos-latest
    needs: [prepare]
    if: needs.prepare.outputs.run-ios == 'true'
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: brew install coreutils

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download iOS runtime from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _build
          cd _build
          gh release download "${{ needs.prepare.outputs.release-tag }}" \
            --pattern "ios-otp-*.tar.gz" \
            --repo ${{ github.repository }}
          tar -xzf ios-otp-*.tar.gz
          echo "Downloaded iOS runtime:"
          ls -la

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install Erlang and Elixir
        run: mise install

      - name: Build test app
        if: ${{ github.event.inputs.skip_build != 'true' }}
        run: |
          mix deps.get
          mix e2e.build --arch ios-arm64-simulator

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Boot iOS Simulator
        run: |
          # Find an iPhone 15 Pro simulator or fallback
          SIMULATOR_ID=$(xcrun simctl list devices available | grep -E "iPhone 15 Pro|iPhone 14 Pro|iPhone 13 Pro" | head -1 | grep -oE "[A-F0-9-]{36}")
          if [ -z "$SIMULATOR_ID" ]; then
            # Create a new simulator if none exists
            SIMULATOR_ID=$(xcrun simctl create "E2E Test iPhone" "iPhone 15 Pro")
          fi
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> $GITHUB_ENV
          xcrun simctl boot "$SIMULATOR_ID" || true
          # Wait for simulator to be ready
          sleep 10

      - name: Run E2E tests on iOS Simulator
        run: |
          mix e2e.run --arch ios-arm64-simulator --output-format junit --output _build/e2e/ios-results.xml
        env:
          SIMULATOR_UDID: ${{ env.SIMULATOR_ID }}

      - name: Shutdown iOS Simulator
        if: always()
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e-results
          path: _build/e2e/ios-results.xml

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '_build/e2e/ios-results.xml'
          check_name: 'iOS E2E Test Results'
          fail_on_failure: true

  summary:
    name: "E2E Summary"
    runs-on: ubuntu-latest
    needs: [e2e-android, e2e-ios]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.e2e-android.result }}" == "success" ]]; then
            echo "- :white_check_mark: Android tests passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.e2e-android.result }}" == "failure" ]]; then
            echo "- :x: Android tests failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :warning: Android tests skipped" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ "${{ needs.e2e-ios.result }}" == "success" ]]; then
            echo "- :white_check_mark: iOS tests passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.e2e-ios.result }}" == "failure" ]]; then
            echo "- :x: iOS tests failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :warning: iOS tests skipped" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any tests failed
        if: needs.e2e-android.result == 'failure' || needs.e2e-ios.result == 'failure'
        run: exit 1
