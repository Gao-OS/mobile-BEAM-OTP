name: "Create Release"

on:
  workflow_dispatch:

env:
  OTP_SOURCE: https://github.com/erlang/otp

permissions:
  contents: write

jobs:
  prepare:
    name: "Prepare release"
    runs-on: ubuntu-latest
    outputs:
      otp-version: ${{ steps.versions.outputs.otp-version }}
      elixir-version: ${{ steps.versions.outputs.elixir-version }}
      tag-name: ${{ steps.versions.outputs.tag-name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read versions from .tool-versions
        id: versions
        run: |
          OTP_VERSION=$(grep '^erlang' .tool-versions | awk '{print $2}')
          # Strip -otp-XX suffix from elixir version (used by mise)
          ELIXIR_VERSION=$(grep '^elixir' .tool-versions | awk '{print $2}' | sed 's/-otp-[0-9]*//')
          TAG_NAME="OTP-${OTP_VERSION}"
          echo "otp-version=${OTP_VERSION}" >> $GITHUB_OUTPUT
          echo "elixir-version=${ELIXIR_VERSION}" >> $GITHUB_OUTPUT
          echo "tag-name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "OTP Version: ${OTP_VERSION}"
          echo "Elixir Version: ${ELIXIR_VERSION}"
          echo "Tag: ${TAG_NAME}"

      - name: Create git tag
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = '${{ steps.versions.outputs.tag-name }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: context.sha
              });
              console.log(`Created tag: ${tagName}`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Tag ${tagName} already exists, continuing...`);
              } else {
                throw error;
              }
            }

  build-android:
    name: "Build Android"
    runs-on: ubuntu-latest
    needs: [prepare]
    env:
      OTP_TAG: OTP-${{ needs.prepare.outputs.otp-version }}
    steps:
      - name: Setup Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ needs.prepare.outputs.otp-version }}
          elixir-version: ${{ needs.prepare.outputs.elixir-version }}

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout OTP source
        uses: actions/checkout@v4
        with:
          repository: erlang/otp
          ref: OTP-${{ needs.prepare.outputs.otp-version }}
          path: _build/otp

      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: _build/*/openssl
          key: openssl-android-${{ needs.prepare.outputs.otp-version }}

      - name: Build Android runtimes
        run: |
          mix deps.get
          mix package.android.runtime

      - name: Package as tar.gz
        run: |
          cd _build
          unzip android-runtime.zip
          tar -czvf android-otp-${{ needs.prepare.outputs.otp-version }}.tar.gz \
            armeabi-v7a/liberlang.a \
            arm64-v8a/liberlang.a \
            x86_64/liberlang.a

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-otp-${{ needs.prepare.outputs.otp-version }}
          path: _build/android-otp-${{ needs.prepare.outputs.otp-version }}.tar.gz

  build-ios:
    name: "Build iOS"
    runs-on: macos-latest
    needs: [prepare]
    env:
      OTP_TAG: OTP-${{ needs.prepare.outputs.otp-version }}
    steps:
      - name: Install dependencies
        run: brew install coreutils

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout OTP source
        uses: actions/checkout@v4
        with:
          repository: erlang/otp
          ref: OTP-${{ needs.prepare.outputs.otp-version }}
          path: _build/otp

      - name: Cache OpenSSL
        uses: actions/cache@v4
        with:
          path: _build/*/openssl
          key: openssl-ios-${{ needs.prepare.outputs.otp-version }}

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install Erlang and Elixir
        run: mise install

      - name: Build iOS runtime
        run: |
          mix deps.get
          mix package.ios.runtime

      - name: Package as tar.gz
        run: |
          cd _build
          tar -czvf ios-otp-${{ needs.prepare.outputs.otp-version }}.tar.gz liberlang.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-otp-${{ needs.prepare.outputs.otp-version }}
          path: _build/ios-otp-${{ needs.prepare.outputs.otp-version }}.tar.gz

  release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [prepare, build-android, build-ios]
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-otp-${{ needs.prepare.outputs.otp-version }}

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-otp-${{ needs.prepare.outputs.otp-version }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.tag-name }}
          name: "OTP ${{ needs.prepare.outputs.otp-version }}"
          body: |
            ## BEAM Runtime for Mobile Platforms

            ### Build Info
            - **OTP Source**: https://github.com/erlang/otp
            - **OTP Version**: ${{ needs.prepare.outputs.otp-version }}
            - **Elixir Version**: ${{ needs.prepare.outputs.elixir-version }}
            - **Build Ref**: ${{ github.sha }}
            - **Build Date**: ${{ github.event.repository.updated_at }}

            ### Included NIFs
            - exqlite (SQLite3)

            ### Architectures
            **Android**: armeabi-v7a, arm64-v8a, x86_64
            **iOS**: arm64, arm64-simulator, x86_64-simulator
          draft: false
          prerelease: false
          files: |
            android-otp-${{ needs.prepare.outputs.otp-version }}.tar.gz
            ios-otp-${{ needs.prepare.outputs.otp-version }}.tar.gz
