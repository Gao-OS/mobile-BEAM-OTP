name: beam_vm
description: "Flutter plugin to embed and run the Erlang/Elixir BEAM VM on Android and iOS"
version: 1.0.0
homepage: https://github.com/Gao-OS/mobile-BEAM-OTP
repository: https://github.com/Gao-OS/mobile-BEAM-OTP
issue_tracker: https://github.com/Gao-OS/mobile-BEAM-OTP/issues
topics:
  - erlang
  - elixir
  - beam-vm
  - embedded-runtime

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.beamvm.beam_vm
        pluginClass: BeamVmPlugin
      ios:
        pluginClass: BeamVmPlugin
